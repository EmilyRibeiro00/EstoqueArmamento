<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Controle de Armamento</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

<style>

  /* reset */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* Variáveis globais */
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --primary: #111827;
    --primary-hover: #1f2937;
    --input-bg: #ffffff;
    --danger: #ef4444;
  }

  /* Define tipografia, cores base e altura da tela */
  body {
    font-family: "Inter", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Estrutura principal da página */
  .login-layout {
    min-height: 100vh;
    display: flex;
  }

  /* Centraliza o card na tela */
  .login-content {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 32px 20px;
  }

  /* Define aparência do formulário */
  .login-card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 40px rgba(17, 24, 39, 0.05);
  }

  /* título */
  .login-card h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  /* descrição */
  .login-card p {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  /* design form */
  .form-group {
    margin-bottom: 18px;
  }

  /* label */
  .form-label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 600;
  }

  /* design inputs */
  .form-input {
    width: 100%;
    height: 48px;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0 14px;
    font-size: 15px;
  }

  /* linha com múltiplos elementos */
  .form-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 22px;
  }
 

  /* botão principal */
  .login-btn {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }

  /* feedback (mensagem neutra) */
  .login-note {
    margin-top: 18px;
    font-size: 13px;
    text-align: center;
    color: var(--muted);
  }

  /* feedback (erro) */
  .error-message {
    margin-top: 14px;
    padding: 12px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: var(--danger);
    display: none; /* oculto por padrão */
    border-radius: 12px;
  }

</style>

<body>

  <!-- Container principal da tela de login -->
  <div class="login-layout">

    <!-- Área principal onde fica o conteúdo -->
    <main class="login-content">

      <!-- Card do formulário de login -->
      <div class="login-card">

        <h1>Entrar</h1>
        <p>Informe suas credenciais para acessar o sistema.</p>

        <!-- Formulário de login -->
        <form>

          <div class="form-group">
            <label class="form-label">Matrícula</label>
            <input class="form-input" type="text" placeholder="Digite sua matrícula" />
          </div>

          <div class="form-group">
            <label class="form-label">Senha</label>
            <input class="form-input" type="password" placeholder="Digite sua senha" />
          </div>

          <button type="submit" class="login-btn">Entrar</button>

          <!-- Mensagem de erro (pode ser exibida dinamicamente via JS) -->
          <div class="error-message">
            Credenciais inválidas. Tente novamente.
          </div>

        </form>
        <!-- SCRIPT -->
        <script src="login.js"></script>
      </div>
    </main>
  </div>

</body>
</html>
